[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ser"
version = "0.1.0"
description = "Reproducibility rebuild of a cross-corpus speech emotion recognition study"
requires-python = ">=3.10"

# Pins mirror requirements.txt exactly. requirements.txt is the lock file of
# record; this list exists so `pip install -e .` reproduces the same environment.
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.8.0",
    "pandas==2.2.2",
    "librosa==0.10.2.post1",
    "soundfile==0.13.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "statsmodels==0.14.2",
    "tqdm==4.66.5",
    "transformers==4.51.2",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "PyYAML==6.0.1",
    "filelock==3.13.1",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[project.scripts]
ser = "ser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
